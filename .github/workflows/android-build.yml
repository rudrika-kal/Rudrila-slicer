name: Rudrila Slicer Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          test -f RudrilaSlicer-alpha07-source.zip
          unzip -t RudrilaSlicer-alpha07-source.zip

      - name: Extract Rudrila Slicer
        run: |
          unzip -q RudrilaSlicer-alpha07-source.zip
          test -f RudrilaSlicer-alpha07-work/settings.gradle.kts
          test -f RudrilaSlicer-alpha07-work/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build APK - Pass 1
        working-directory: RudrilaSlicer-alpha07-work
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK - Pass 1
        run: |
          test -f RudrilaSlicer-alpha07-work/app/build/outputs/apk/debug/app-debug.apk
          unzip -t RudrilaSlicer-alpha07-work/app/build/outputs/apk/debug/app-debug.apk
          ls -lh RudrilaSlicer-alpha07-work/app/build/outputs/apk/debug/app-debug.apk

      - name: Clean before second build
        working-directory: RudrilaSlicer-alpha07-work
        run: |
          gradle clean

      - name: Build APK - Pass 2
        working-directory: RudrilaSlicer-alpha07-work
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK - Pass 2
        run: |
          APK="RudrilaSlicer-alpha07-work/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          cp "$APK" Rudrila-Slicer-Alpha07.apk

      - name: Upload Rudrila Slicer APK
        uses: actions/upload-artifact@v4
        with:
          name: Rudrila-Slicer-Alpha07-APK
          path: Rudrila-Slicer-Alpha07.apk
          if-no-files-found: error
          retention-days: 30
